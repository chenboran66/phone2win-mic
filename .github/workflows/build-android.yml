name: Build Android APK (32-bit + 64-bit + Universal)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install Android SDK, NDK r26 and CMake
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Generate Legacy PNG Launcher Icons for Old Android 5~7 Devices
        run: |
          python3 - <<'PY'
          import os, struct, zlib, math

          def write_png(path, w, h, pixels):
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  raw.extend(pixels[y * w * 4:(y + 1) * w * 4])
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
              png += chunk(b'IEND', b'')
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(png)

          def render_icon(size):
              buf = bytearray(size * size * 4)
              cx = size * 0.5
              cy = size * 0.5
              r_bg = size * 0.45
              for y in range(size):
                  for x in range(size):
                      nx = (x + 0.5 - cx) / size
                      ny = (y + 0.5 - cy) / size
                      dist = math.hypot(x + 0.5 - cx, y + 0.5 - cy)
                      idx = (y * size + x) * 4
                      if dist > r_bg:
                          continue
                      # Blue circle background (#1967D2)
                      r, g, b, a = 0x19, 0x67, 0xD2, 0xFF
                      # White microphone shape
                      in_capsule = (abs(nx) <= 0.105 and -0.22 <= ny <= 0.04) or \
                                   (math.hypot(nx, ny + 0.22) <= 0.105) or \
                                   (math.hypot(nx, ny - 0.04) <= 0.105)
                      arc_r = math.hypot(nx, ny - 0.02)
                      in_arc = (ny >= 0.02 and 0.16 <= arc_r <= 0.21)
                      in_stem = (abs(nx) <= 0.03 and 0.19 <= ny <= 0.30)
                      in_base = (abs(nx) <= 0.13 and 0.28 <= ny <= 0.33)
                      if in_capsule or in_arc or in_stem or in_base:
                          r, g, b = 0xFF, 0xFF, 0xFF
                      buf[idx:idx+4] = bytes((r, g, b, a))
              return buf

          base = 'android/app/src/main/res'
          for folder, sz in [
              ('mipmap-mdpi', 48),
              ('mipmap-hdpi', 72),
              ('mipmap-xhdpi', 96),
              ('mipmap-xxhdpi', 144),
              ('mipmap-xxxhdpi', 192),
          ]:
              write_png(os.path.join(base, folder, 'ic_launcher.png'), sz, sz, render_icon(sz))

          legacy_xml = os.path.join(base, 'mipmap-anydpi-v21', 'ic_launcher.xml')
          if os.path.exists(legacy_xml):
              os.remove(legacy_xml)
          print("Generated PNG launcher icons for API 21..25 compatibility.")
          PY

      - name: Prepare Release Keystore (Secrets or Auto-Generated)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PATH="${{ github.workspace }}/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "P2W_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
            echo "P2W_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "P2W_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "P2W_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using persistent release keystore from GitHub Secrets."
          else
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storepass "phone2win123" \
              -alias "phone2win" \
              -keypass "phone2win123" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Phone2WinMic, OU=Audio, O=Phone2Win, L=Local, ST=Local, C=CN"
            echo "P2W_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
            echo "P2W_KEYSTORE_PASSWORD=phone2win123" >> "$GITHUB_ENV"
            echo "P2W_KEY_ALIAS=phone2win" >> "$GITHUB_ENV"
            echo "P2W_KEY_PASSWORD=phone2win123" >> "$GITHUB_ENV"
            echo "Generated temporary release keystore so APKs are immediately installable."
          fi

      - name: Build 32-bit, 64-bit and Universal Signed Release APKs
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Collect and Verify 32-bit / 64-bit APKs
        run: |
          mkdir -p dist
          OUT="android/app/build/outputs/apk/release"
          ls -lh "$OUT"

          cp "$OUT/app-armeabi-v7a-release.apk" "dist/Phone2WinMic-32bit-armeabi-v7a.apk"
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/Phone2WinMic-64bit-arm64-v8a.apk"
          cp "$OUT/app-universal-release.apk"   "dist/Phone2WinMic-universal-32and64bit.apk"

          echo "=== Verify 32-bit APK native lib ==="
          unzip -l "dist/Phone2WinMic-32bit-armeabi-v7a.apk" | grep "libaudiodsp.so"
          echo "=== Verify 64-bit APK native lib ==="
          unzip -l "dist/Phone2WinMic-64bit-arm64-v8a.apk" | grep "libaudiodsp.so"
          echo "=== Verify Universal APK contains BOTH 32-bit and 64-bit native libs ==="
          unzip -l "dist/Phone2WinMic-universal-32and64bit.apk" | grep "libaudiodsp.so"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Phone2WinMic-APKs-32bit-64bit-Universal
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
