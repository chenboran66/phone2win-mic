plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phone2win.mic'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.phone2win.mic'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        externalNativeBuild {
            cmake {
                cFlags '-O2'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // Build 32-bit (armeabi-v7a), 64-bit (arm64-v8a), and a combined universal APK simultaneously
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('P2W_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('P2W_KEYSTORE_PASSWORD') ?: 'phone2win123'
                keyAlias System.getenv('P2W_KEY_ALIAS') ?: 'phone2win'
                keyPassword System.getenv('P2W_KEY_PASSWORD') ?: 'phone2win123'
            }
            // V1 is required for Android 5.0/6.0; V2 is required for modern Android 7+
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            def ksPath = System.getenv('P2W_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.trim().isEmpty() && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure Android Framework SDK: zero third-party dependency bloat, wide API 21..35 compatibility
}
